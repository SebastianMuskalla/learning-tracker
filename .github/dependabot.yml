version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch updates. Major updates get their own PRs.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.x until vue-tsc and typescript-eslint support 7 (see README.md).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The Node types must match the Node version in .nvmrc.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
