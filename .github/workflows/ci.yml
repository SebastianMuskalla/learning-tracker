name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets deploy.yml run the same checks before it builds.
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` is the caller's name when this runs through workflow_call, so the deploy run
  # and the normal CI run for the same push do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build

      # Browser tests against the build from the step above.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
